{
  "id": "tesseract-js",
  "name": "Tesseract.js local OCR",
  "kind": "parser",
  "official_url": "https://github.com/naptha/tesseract.js",
  "version": "7.0.0",
  "interface": "Node library + local Poppler rasterizer",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "offline-local-ocr",
    "page-locators",
    "page-confidence",
    "bundled-eng-traineddata",
    "bundled-chi-sim-traineddata"
  ],
  "inputs": [
    "scanned-pdf",
    "page-image"
  ],
  "outputs": [
    "ocr-text",
    "ocr-confidence",
    "page-locators",
    "unverified-evidence"
  ],
  "dependencies": [
    "tesseract.js@7.0.0",
    "@tesseract.js-data/eng@1.0.0",
    "@tesseract.js-data/chi_sim@1.0.0",
    "local pdftoppm executable"
  ],
  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "free-local",
  "editable": "not-applicable",
  "license": {
    "identifier": "Apache-2.0 + MIT traineddata packages",
    "review_status": "verified-from-package-metadata",
    "note": "Tesseract.js is Apache-2.0; the separately bundled English and Simplified Chinese traineddata npm packages declare MIT."
  },
  "verification_status": "e2e-tested",
  "adapter": "src/document-extractors.mjs",
  "probe": null,
  "limitations": "OCR requires local Poppler pdftoppm for PDF rasterization. Only eng and chi_sim are bundled. Recognition confidence is not scientific verification; compare OCR text with the page image.",
  "status": "e2e-tested"
}
