{
  "id": "marp",
  "name": "Marp CLI",
  "kind": "deck-backend",
  "official_url": "https://github.com/marp-team/marp-cli",
  "version": "4.5.1",
  "interface": "CLI",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "deck-backend"
  ],
  "inputs": [
    "markdown",
    "qmd",
    "html"
  ],
  "outputs": [
    "html",
    "pdf",
    "pptx"
  ],
  "dependencies": [
    "isolated workers/marp npm install and Chrome, Edge, or Firefox for non-HTML outputs"
  ],
  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "unknown",
  "editable": "partial",
  "license": {
    "identifier": "MIT",
    "review_status": "needs-review",
    "note": "Verify the current upstream license and transitive dependencies before production use."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/marp.mjs",
  "probe": {
    "command": "marp"
  },
  "limitations": "Default PPTX output is rendered page images, not editable text/shapes/charts. Editable PPTX is experimental and requires LibreOffice; source Markdown is kept separately.",
  "status": "e2e-tested"
}
