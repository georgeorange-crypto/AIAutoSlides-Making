{
  "id": "graphviz",
  "name": "Graphviz",
  "kind": "diagram",
  "official_url": "https://graphviz.org/",
  "version": "16.1.1",
  "interface": "isolated Graphviz dot CLI over validated JSON graph spec",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "directed-graph-layout",
    "dot-source-generation",
    "svg-render",
    "png-render",
    "source-lineage-and-hashes"
  ],
  "inputs": [
    "validated-graph-json",
    "evidence-ledger"
  ],
  "outputs": [
    "svg",
    "png",
    "dot-source",
    "diagram-manifest"
  ],
  "dependencies": [
    "workers/graphviz/.tools/16.1.1/ (official Windows x64 ZIP) or configured system Graphviz executable"
  ],
  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "free-local",
  "editable": "partial",
  "license": {
    "identifier": "EPL-2.0",
    "review_status": "verified-in-repository",
    "note": "Graphviz official license page states current releases are under Eclipse Public License 2.0. The official Windows ZIP contains runtime libraries/plugins; review bundled notices before redistributing that binary package."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/graphviz.mjs",
  "probe": {
    "command": "dot"
  },
  "limitations": "Accepts a bounded JSON graph contract and generates DOT; arbitrary DSL, external images and URL references are not accepted. SVG/PNG are image objects in PPTX, not native editable shapes. Windows installer is pinned; Linux/macOS require a configured system Graphviz executable.",
  "status": "e2e-tested"
}
