{
  "id": "ooxml-text-replacer",
  "name": "AIAutoSlides exact-text OOXML editor",
  "kind": "editor",
  "official_url": "https://github.com/georgeorange-crypto/AIAutoSlides-Making",
  "version": "not-pinned",
  "interface": "Node API + CLI",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "exact-single-run-text-replacement",
    "untouched-slide-xml-preservation",
    "before-after-page-comparison"
