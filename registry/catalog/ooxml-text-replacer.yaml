  "license": {
    "identifier": "MIT",
    "review_status": "verified-in-repository",
    "note": "Internal project code; root package.json declares MIT."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/ooxml-text.mjs",
  "probe": null,
