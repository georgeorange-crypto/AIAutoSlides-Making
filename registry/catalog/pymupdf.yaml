{
  "id": "pymupdf",
  "name": "PyMuPDF",
  "kind": "parser",
  "official_url": "https://pymupdf.readthedocs.io/en/latest/",
  "version": "2.1",
  "interface": "isolated Python 3.12 worker",
  "platforms": ["windows", "linux", "macos"],
  "capabilities": ["selectable-text", "page-locators", "embedded-image-extraction", "vector-drawing-coordinates", "page-preview", "source-sha256"],
