  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "free-local",
  "editable": "not-applicable",
  "license": {
    "identifier": "AGPL-3.0-only OR commercial",
    "review_status": "needs-review",
    "note": "PyMuPDF and MuPDF are offered under AGPL or commercial terms. The pinned wheel dependency closure and distribution model require an approved licensing review before redistribution."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/pymupdf.mjs",
  "probe": null,
  "limitations": "Local-only and bounded extraction. OCR is not run. Empty text may indicate scanned/vector-only pages. Image reuse permissions are unknown. A maximum of 100 extracted images / 50 MiB / 25 million pixels per image and 2,000 vector drawing records per page applies. Evidence remains unverified.",
  "status": "e2e-tested"
}
