{
  "id": "quarto",
  "name": "Quarto",
  "kind": "deck-backend",
  "official_url": "https://github.com/quarto-dev/quarto-cli",
  "version": "1.11.9",
  "interface": "isolated Quarto CLI over bounded evidence-linked slide JSON",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "native-text-pptx",
    "revealjs-html",
    "source-lineage-and-hashes"
  ],
  "inputs": [
    "bounded-presentation-json",
    "evidence-ledger"
  ],
  "outputs": [
    "pptx",
    "revealjs-html",
    "source-manifest"
  ],
  "dependencies": [
    "workers/quarto/.tools/1.11.9/ official Windows ZIP or configured Quarto CLI"
  ],
  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "free-local",
  "editable": "partial",
  "license": {
    "identifier": "MIT",
    "review_status": "verified-in-repository",
    "note": "Quarto source is MIT licensed; official standalone binary and bundled runtimes are not redistributed by this repository."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/quarto.mjs",
  "probe": {
    "command": "quarto"
  },
  "limitations": "Accepts plain-text slide specs only; code execution, extensions, HTML, URLs and images are not supported. PPTX output is checked for editable text and source IDs; page visual fidelity remains renderer-dependent. Windows pinned installer; Linux/macOS require a configured executable.",
  "status": "e2e-tested"
}
