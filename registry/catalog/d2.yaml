{
  "id": "d2",
  "name": "D2",
  "kind": "diagram",
  "official_url": "https://github.com/terrastruct/d2",
  "version": "0.9.0",
  "interface": "isolated D2 CLI over bounded source-linked JSON spec",
  "platforms": [
    "windows",
    "linux",
    "macos"
  ],
  "capabilities": [
    "D2-DSL-render",
    "svg-render",
    "png-render",
    "source-lineage-and-hashes"
  ],
  "inputs": [
    "bounded-d2-json",
    "evidence-ledger"
  ],
  "outputs": [
    "svg",
    "png",
    "d2-source",
    "diagram-manifest"
  ],
  "dependencies": [
    "workers/d2/.tools/0.9.0/ official Windows x64 release or configured system D2 executable"
  ],
  "needs_network": false,
  "needs_auth": false,
  "expected_cost": "free-local",
  "editable": "partial",
  "license": {
    "identifier": "MIT",
    "review_status": "verified-in-repository",
    "note": "D2 upstream project is MIT licensed; official standalone archive and bundled notices are not redistributed by this repository."
  },
  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/d2.mjs",
  "probe": {
    "command": "d2"
  },
  "limitations": "Accepts bounded D2 source in JSON with source IDs; imports, URLs, external image/icon directives are rejected. SVG/PNG are image objects in PPTX, not native PowerPoint shapes. Pinned installer is Windows x64; Linux/macOS require a configured D2 executable.",
  "status": "e2e-tested"
}
