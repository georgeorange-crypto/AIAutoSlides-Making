{
  "id": "crossref",
  "name": "Crossref REST API",
  "kind": "research-metadata",
  "official_url": "https://www.crossref.org/documentation/retrieve-metadata/rest-api/",
  "version": "REST API v1",
  "interface": "HTTPS GET /works/{doi}",
  "platforms": ["windows", "linux", "macos"],
  "capabilities": ["doi-lookup", "bibliographic-metadata", "source-hash", "unverified-source-record"],
