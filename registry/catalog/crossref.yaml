  "verification_status": "e2e-tested",
  "adapter": "packages/adapters/crossref.mjs",
  "probe": null,
  "limitations": "DOI lookup returns selected bibliographic metadata only; no full text, abstract, evidence excerpt, or scientific verification. Public requests are serialized and cached briefly.",
  "status": "e2e-tested"
}
